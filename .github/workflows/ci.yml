name: CI

# The CI gate. Every pull request, every push to master (and every merge-queue
# run) goes through these jobs. Branch protection on master requires ONE check,
# "CI gate", which passes only if every job below succeeded - so jobs can be
# added or the Python matrix changed without touching the repository settings
# (see tools/protect_branch.sh).

on:
  push:
    branches: [master]
  pull_request:
    # `edited` re-runs the gate when the PR title (checked below) or the base branch changes;
    # a re-run of an older run would reuse the old title from its event payload.
    types: [opened, synchronize, reopened, edited]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install PyTorch (CPU wheel)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install hcnn with dev extras
        run: pip install -e ".[dev]"

      - name: Run test suite (architecture contract, tutorials in fast mode, ...)
        run: pytest -q --durations=10

  build:
    name: build package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: Install the wheel in a clean environment and import it
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/wheel-env/bin/pip install --quiet dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/python -c "import hcnn; print(hcnn.__version__, hcnn.list_architectures())"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  commit-messages:
    name: commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check every commit in the PR
        run: |
          python3 tools/check_commit_msg.py \
            --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Check the PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | python3 tools/check_commit_msg.py --header-only -

  gate:
    name: CI gate
    if: always()
    needs: [test, build, commit-messages]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          # commit-messages only runs on pull requests; skipped is fine elsewhere.
          optional = {"commit-messages"}
          failed = []
          for job, info in json.loads(os.environ["NEEDS"]).items():
              result = info["result"]
              ok = result == "success" or (result == "skipped" and job in optional)
              print(f"{'ok  ' if ok else 'FAIL'} {job}: {result}")
              if not ok:
                  failed.append(job)
          sys.exit(f"CI gate closed: {', '.join(failed)}" if failed else 0)
          EOF
